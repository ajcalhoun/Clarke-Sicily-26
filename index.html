<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clarkes in Sicily</title>
  <meta name="apple-mobile-web-app-title" content="Sicily 25"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#1A3252"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    /* ── COLORS ── warm Mediterranean palette */
    :root{
      --orange:#C85C2E;--orange-2:#A84520;
      --navy:#1A3252;--sand:#E8B84B;
      --bg:#F7F3EF;--card:#FFFFFF;--rule:#D1D5DB;--text:#111827;--muted:#4B5563;
      --shadow:0px 4px 12px rgba(0,0,0,0.08);--radius:12px;--hdr:148px
    }

    html,body,#root{height:100%}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;line-height:1.5}

    /* HEADER */
    .app-header{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--navy);padding:18px 24px 0;text-align:center}
    .header-title{font-size:clamp(18px,4.5vw,28px);font-weight:700;color:#fff;letter-spacing:-.3px;line-height:1.1}
    .header-dates{margin-top:3px;font-size:11px;font-weight:400;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.5)}
    .header-route{margin-top:2px;font-size:13px;color:rgba(255,255,255,.65);letter-spacing:.3px}
    .tab-bar{display:flex;margin-top:12px}
    .tab-btn{flex:1;padding:10px 0;border:none;background:none;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:rgba(255,255,255,.6);cursor:pointer;border-bottom:2px solid transparent;transition:all .18s}
    .tab-btn.active{color:#fff;border-bottom-color:var(--sand)}
    .tab-btn:hover:not(.active){color:rgba(255,255,255,.7)}

    .tab-content{padding-top:calc(var(--hdr) + 2px);max-width:820px;margin:0 auto;padding-left:16px;padding-right:16px;padding-bottom:60px}
    .sl{font-size:11px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin:24px 0 12px;display:flex;align-items:center;gap:10px}
    .sl::after{content:'';flex:1;height:1px;background:var(--rule)}
    .sl:first-child{margin-top:20px}

    /* WEATHER CARDS */
    .weather-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
    .weather-card{border:1px solid var(--rule);border-radius:var(--radius);padding:13px 15px;background:var(--card);border-left-width:3px;box-shadow:var(--shadow)}
    .wc-zone{font-weight:600;font-size:13px}
    .wc-dates{font-size:11px;color:var(--muted);margin:2px 0 5px}
    .wc-desc{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:8px}
    .wc-forecast{border-top:1px dashed var(--rule);padding-top:8px}
    .wc-days{display:flex;gap:3px;overflow-x:auto;padding-bottom:2px}
    .wc-day{flex:1;min-width:36px;text-align:center;background:var(--bg);border-radius:8px;padding:5px 2px}
    .wc-day-label{font-size:10px;font-weight:600;color:var(--muted);margin-bottom:1px}
    .wc-day-icon{font-size:13px;margin:2px 0}
    .wc-day-hi{font-size:11px;font-weight:600}
    .wc-day-lo{font-size:10px;color:var(--muted)}
    .wc-day-rain{font-size:10px;color:#1d4ed8;margin-top:1px;font-weight:500}
    .wc-pending{padding:6px 0 2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .wc-avgs{font-size:12px;font-weight:600;color:var(--muted)}
    .wc-avgs small{font-weight:300;font-size:10px;margin-left:2px}
    .wc-eta{font-size:10px;background:var(--bg);border-radius:99px;padding:2px 8px;color:var(--muted);white-space:nowrap}
    .wc-loading{font-size:11px;color:var(--muted);font-style:italic;padding:6px 0}
    .wx-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
    .wx-updated{font-size:11px;color:var(--muted);font-style:italic}
    .refresh-btn{font-size:11px;font-family:'Inter',sans-serif;background:none;border:1px solid var(--rule);border-radius:99px;padding:3px 10px;color:var(--muted);cursor:pointer;transition:all .15s}
    .refresh-btn:hover{border-color:var(--navy);color:var(--navy)}
    .refresh-btn:disabled{opacity:.5;cursor:default}

    /* DAY CARDS */
    .day-card{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
    .day-header{display:flex;align-items:stretch;cursor:pointer;user-select:none}
    .day-num{width:48px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:white;min-height:64px}
    .day-header-body{flex:1;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
    .day-header-left{flex:1;min-width:0}
    .day-date-label{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
    .day-title{font-size:14px;font-weight:600;color:var(--text);line-height:1.3}
    .day-location{font-size:11px;color:var(--muted);margin-top:2px}
    .day-header-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
    .day-wx{text-align:right}
    .day-wx-icon{font-size:15px;line-height:1}
    .day-wx-temps{font-size:11px;font-weight:600;white-space:nowrap;margin-top:1px}
    .day-wx-rain{font-size:10px;color:#3b82f6;white-space:nowrap;margin-top:1px}
    .day-wx-pending{font-size:11px;color:var(--muted);white-space:nowrap}
    .day-chevron{font-size:11px;color:var(--muted);transition:transform .2s;flex-shrink:0}
    .day-chevron.open{transform:rotate(180deg)}
    .day-body{border-top:1px solid var(--rule);padding:12px 14px 14px}
    .day-tip{background:#FFF8F0;border-left:3px solid var(--orange);border-radius:8px;padding:8px 12px;font-size:13px;color:#7C2D12;line-height:1.6;margin-bottom:12px}
    .day-tip strong{font-weight:700;color:#7C2D12}

    /* SPLIT TIMELINE */
    .split-timeline{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
    .split-col-label{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--rule)}

    /* TIMELINE */
    .timeline{display:flex;flex-direction:column}
    .tl-item{display:flex;gap:9px;align-items:flex-start;position:relative}
    .tl-item:not(:last-child) .tl-dot-wrap::after{content:'';position:absolute;left:5px;top:13px;width:1px;bottom:-6px;background:var(--rule)}
    .tl-dot-wrap{position:relative;flex-shrink:0;width:11px}
    .tl-dot{width:11px;height:11px;border-radius:50%;background:var(--rule);position:relative;z-index:1;margin-top:3px}
    .tl-dot.highlight{background:var(--orange)}
    .tl-dot.flight{background:var(--navy)}
    .tl-dot.food{background:#16a34a}
    .tl-dot.church{background:#2563eb}
    .tl-dot.key{background:var(--orange-2)}
    .tl-text{padding-bottom:9px;flex:1;min-width:0}
    .tl-time{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.5px;margin-bottom:1px}
    .tl-desc{font-size:13px;color:var(--text);line-height:1.5}
    .tl-note{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5}
    .tl-links{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
    .tl-link{font-size:11px;font-family:'Inter',sans-serif;color:var(--navy);text-decoration:none;border:1px solid rgba(26,50,82,.3);border-radius:99px;padding:2px 9px;display:inline-flex;align-items:center;gap:3px;transition:all .15s;white-space:nowrap}
    .tl-link:hover{background:var(--navy);color:#fff;border-color:var(--navy)}

    /* PACKING LIST */
    .progress-bar-wrap{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:14px 16px;margin-bottom:4px;box-shadow:var(--shadow)}
    .progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .progress-title{font-size:13px;font-weight:600}
    .progress-frac{font-size:12px;color:var(--muted)}
    .progress-track{height:5px;background:var(--rule);border-radius:99px;overflow:hidden}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--orange-2));border-radius:99px;transition:width .4s ease}
    .filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
    .filter-btn{padding:5px 13px;border-radius:99px;border:1px solid var(--rule);background:var(--card);font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s}
    .filter-btn:hover{border-color:var(--navy);color:var(--navy)}
    .filter-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
    .pack-section{margin-bottom:6px;border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
    .pack-header{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;cursor:pointer;user-select:none;transition:background .1s}
    .pack-header:hover{background:var(--bg)}
    .pack-header-left{font-weight:600;font-size:14px}
    .pack-header-right{display:flex;align-items:center;gap:8px}
    .pack-count{font-size:11px;color:var(--muted)}
    .pack-chevron{font-size:10px;color:var(--muted);transition:transform .2s}
    .pack-chevron.open{transform:rotate(180deg)}
    .pack-items{padding:4px 12px 10px;border-top:1px solid var(--rule)}
    .pack-item{display:flex;align-items:flex-start;gap:10px;padding:7px 5px;border-radius:8px;cursor:pointer;transition:background .1s}
    .pack-item:hover{background:var(--bg)}
    .pack-item.done{text-decoration:line-through;color:var(--muted)}
    .checkbox{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--rule);background:white;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .15s}
    .checkbox.checked{background:var(--orange);border-color:var(--orange)}
    .checkbox.checked::after{content:'✓';color:white;font-size:10px;font-weight:700}
    .item-text{font-size:13.5px;line-height:1.4;flex:1}
    .item-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
    .tag{font-size:10px;font-weight:600;letter-spacing:.5px;padding:1px 7px;border-radius:99px;text-transform:uppercase}
    .tag-required{background:#FFF3F0;color:#9A3412;border:1px solid rgba(200,92,46,.25)}
    .tag-beach{background:#ecfeff;color:#0e7490;border:1px solid #a5f3fc}
    .tag-atv{background:#f3e8ff;color:#6d28d9;border:1px solid rgba(109,40,217,.25)}
    .app-footer{text-align:center;margin-top:28px;font-size:11px;color:var(--muted);letter-spacing:1px}
    .sync-bar{display:flex;align-items:center;justify-content:space-between;margin:20px 0 8px;gap:12px}
    .sync-ts{font-size:11px;color:var(--muted);font-style:italic;white-space:nowrap}
    .sync-btn{font-size:11px;font-family:'Inter',sans-serif;background:none;border:1px solid var(--rule);border-radius:99px;padding:3px 10px;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0}
    .sync-btn:hover:not(:disabled){border-color:var(--navy);color:var(--navy)}
    .sync-btn:disabled{opacity:.5;cursor:default}
    .sync-err{font-size:12px;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:7px 11px;margin-bottom:8px;line-height:1.5}
    .day-wx-strip{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg);border-radius:8px;margin-bottom:10px}
    .day-wx-strip-icon{font-size:22px;line-height:1;flex-shrink:0}
    .day-wx-strip-info{flex:1}
    .day-wx-strip-temps{font-size:13px;font-weight:600}
    .day-wx-strip-rain{font-size:12px;color:#3b82f6;margin-top:1px}
    .day-wx-strip-source{font-size:10px;color:var(--muted);font-style:italic;text-align:right;flex-shrink:0}
    @media(max-width:560px){.split-timeline{grid-template-columns:1fr}.weather-grid{grid-template-columns:1fr}:root{--hdr:156px}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { useState, useEffect, useCallback } = React;

  const STORAGE_KEY  = 'clarkes_packing_v1';
  const WEATHER_KEY  = 'clarkes_weather_v1';
  const _td=new Date();
  const TODAY=`${_td.getFullYear()}-${String(_td.getMonth()+1).padStart(2,'0')}-${String(_td.getDate()).padStart(2,'0')}`;
  const WEATHER_TTL  = 6*60*60*1000;
  const OM_BASE      = 'https://api.open-meteo.com/v1/forecast';

  /* ══ WEATHER ZONES ══ */
  const ZONES = [
    {
      zone:    "🇵🇹 Lisbon",

    {

    {

    },
    {
      zone:    "🇪🇸 Madrid",
      start:   "2026-06-26",
      end:     "2026-06-28",
      lat:     40.4168,
      lon:     -3.7038,
      color:   "#b91c1c",
      avgHi:   86,
      avgLo:   63,
      avgRain: 12,
      desc:    "Hot and dry. Great walking weather. Light clothing and sunscreen a must."
    },
    {
      zone:    "🇪🇸 Barcelona",
      start:   "2026-06-28",
      end:     "2026-07-03",
      lat:     41.3851,
      lon:     2.1734,
      color:   "#c2410c",
      avgHi:   82,
      avgLo:   68,
      avgRain: 8,
      desc:    "Warm and sunny. Beach weather. Light layers for evening on the Ramblas."
    },
  ];

  /* ── Weather helpers ── */
  const wmoEmoji = c => {
    c = parseInt(c ?? 0);
    if (c === 0) return '☀️'; if (c === 1) return '🌤'; if (c === 2) return '⛅';
    if (c === 3) return '☁️'; if ([45,48].includes(c)) return '🌫';
    if ([51,53,55,56,57].includes(c)) return '🌦';
    if ([61,63,65,66,67,80,81,82].includes(c)) return '🌧';
    if ([71,73,75,77,85,86].includes(c)) return '❄️';
    if ([95,96,99].includes(c)) return '⛈'; return '🌡';
  };
  const dayLabel  = s => { const d = new Date(s+'T12:00:00Z'); return ['Su','M','T','W','Th','F','Sa'][d.getUTCDay()]+' '+d.getUTCDate(); };
  const daysUntil = s => { const t = new Date(); t.setHours(0,0,0,0); return Math.max(0,Math.ceil((new Date(s+'T00:00:00')-t)/86400000)-16); };
  const timeAgo   = ts => { if(!ts) return null; const m=Math.round((Date.now()-ts)/60000); if(m<1)return'just now'; if(m<60)return`${m}m ago`; return`${Math.round(m/60)}h ago`; };

  /* ── Legacy sheet integration (disabled) ── */
  const SHEET_ID  = '';
  const SHEET_TAB = 'flow';
  const SHEET_KEY = 'clarkes_sheet_v1';
  const SHEET_TTL = 15*60*1000;
  const sheetCSVUrl = () => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${SHEET_TAB}`;

  /* ── Live Google Sheets sync ── */
  const LIVE_SHEET_ID = '1nrFU4v9aPJKIwYjBg5YMMWVU8wxwAxJ-bjLtitfHoAc';
  const SYNC_KEY  = 'clarkes_sync_v1';
  const SYNC_TTL  = 60 * 60 * 1000; // re-fetch after 1 hour
  const SHEET_YEAR = 2026;
  function parseCSVRows(text){const rows=[];let row=[],f='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){f+='"';i++;}else if(c==='"')q=false;else f+=c;}else{if(c==='"')q=true;else if(c===','){row.push(f);f='';}else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}else if(c!=='\r')f+=c;}}if(f||row.length){row.push(f);rows.push(row);}return rows;}
  function parseSheetCSV(csv){const rows=parseCSVRows(csv);const events={};let currentDate=null;const MNUM={Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};const CAT_TYPE={Flights:'flight',Food:'food',Sightseeing:'highlight',Entertainment:'highlight',Lodging:'key'};const CHURCH_RX=/abbey|vatican|basilica|cathedral|chapel|prayer/i;const YEAR=new Date().getFullYear();for(const row of rows){const a=(row[0]||'').trim(),b=(row[1]||'').trim(),c=(row[2]||'').trim();const d=(row[3]||'').trim(),cat=(row[14]||'').trim();if(!a||!c||a.includes('Date'))continue;const dayNum=parseInt(b);if(b&&!isNaN(dayNum)&&dayNum>0){const m=a.match(/([A-Z][a-z]{2})\s+(\d+)/);if(m&&MNUM[m[1]]){currentDate=`${YEAR}-${String(MNUM[m[1]]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;if(!events[currentDate])events[currentDate]=[];}}else if(currentDate){if(a==='11:59 PM'&&cat==='Lodging')continue;const type=CHURCH_RX.test(c)?'church':(CAT_TYPE[cat]||'');events[currentDate].push({time:a,text:c,note:d||'',type,group:'all'});}}return events;}
  async function fetchSheet(){if(!SHEET_ID)return null;const res=await fetch(sheetCSVUrl());if(!res.ok)throw new Error('sheet fetch failed');return parseSheetCSV(await res.text());}

  /* ── Live sync parsers ── */

  // "Fri, Jun 5" → "2026-06-05"
  function parseSheetDate(str){
    if(!str)return null;
    str=str.trim();
    const MN={Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
    const m=str.match(/([A-Z][a-z]{2})\s+(\d+)/);
    if(!m||!MN[m[1]])return null;
    return `${SHEET_YEAR}-${String(MN[m[1]]).padStart(2,'0')}-${String(parseInt(m[2])).padStart(2,'0')}`;
  }

  // Infer dot color from event title
  function inferType(t){
    if(/flight|depart|layover|easyjet|ryanair|\baa\d|interbus|trenitalia|\btrain\b|bus to/i.test(t))return'flight';
    if(/lunch|dinner|breakfast|nata|cocktail|cake|restaurant|boa-boa/i.test(t))return'food';
    if(/church|chapel|basilica|cathedral|riverside int/i.test(t))return'church';
    if(/check.?in|checkout|check.?out|hotel|stay at|send.?off|arrive.*airport|arrive.*station/i.test(t))return'key';
    if(/tour|visit|museum|surf|boat|quad|iliad|photo session|ceremony|rehearsal|lesson|excursion|rental car|surprise activity/i.test(t))return'highlight';
    return'';
  }

  // JSONP loader — works from file://, localhost, and GitHub Pages alike.
  // Google's gviz/tq endpoint supports JSONP for publicly-shared sheets.
  function fetchSheetJsonp(sheetName){
    return new Promise((resolve,reject)=>{
      const cb=`_gs_${Date.now()}_${Math.random().toString(36).slice(2)}`;
      const script=document.createElement('script');
      const cleanup=()=>{ delete window[cb]; if(script.parentNode)script.parentNode.removeChild(script); };
      const timer=setTimeout(()=>{ cleanup(); reject(new Error('Request timed out after 15 s')); },15000);
      window[cb]=(data)=>{
        clearTimeout(timer); cleanup();
        if(data.status==='error'){
          const msg=(data.errors&&data.errors[0]&&data.errors[0].detailed_message)||'Sheet returned an error';
          reject(new Error(msg)); return;
        }
        resolve(data);
      };
      const url=`https://docs.google.com/spreadsheets/d/${LIVE_SHEET_ID}/gviz/tq?tqx=responseHandler:${cb}${sheetName?`&sheet=${encodeURIComponent(sheetName)}`:''}`;
      script.src=url;
      script.onerror=()=>{ clearTimeout(timer); cleanup(); reject(new Error('Could not reach Google Sheets — make sure the Sheet is set to "Anyone with the link can view"')); };
      document.head.appendChild(script);
    });
  }

  // Convert a gviz JSON table to an array of string arrays (same shape as parseCSVRows output).
  // gviz does NOT include a header row in .rows — headers live in .cols[i].label.
  function gvizToRows(data){
    const numCols=(data.table?.cols||[]).length;
    return(data.table?.rows||[]).map(row=>{
      const cells=row.c||[];
      return Array.from({length:numCols},(_,i)=>{ const v=cells[i]?.v; return v!=null?String(v):''; });
    });
  }

  // Tab 2: schedule_items  (Date, Start_Time, End_Date, End_Time, Title, Notes, Maps_URL, Ticket_URL)
  function parseScheduleItems(rows){
    const evts={};
    for(const row of rows){
      const dateStr=(row[0]||'').trim(),startTime=(row[1]||'').trim();
      const endDateStr=(row[2]||'').trim(),endTime=(row[3]||'').trim();
      const title=(row[4]||'').trim(),notes=(row[5]||'').trim();
      const mapUrl=(row[6]||'').trim()||undefined,ticketUrl=(row[7]||'').trim()||undefined;
      if(!dateStr||!title)continue;
      const startDate=parseSheetDate(dateStr);
      if(!startDate)continue;
      const diffDay=endDateStr&&endDateStr.trim()&&endDateStr.trim()!==dateStr.trim();
      const endDate=diffDay?parseSheetDate(endDateStr):null;
      // Multi-day "Stay at Hotel" → check-in event on start day, checkout event on end day
      if(/stay at/i.test(title)&&endDate){
        const label=title.replace(/^Stay at\s*/i,'');
        if(!evts[startDate])evts[startDate]=[];
        evts[startDate].push({time:startTime||'',text:`Check in — ${label}`,note:notes,type:'key',mapUrl,ticketUrl});
        if(!evts[endDate])evts[endDate]=[];
        evts[endDate].push({time:endTime||'',text:`Checkout — ${label}`,note:notes?`Conf: ${notes}`:'',type:'key',mapUrl});
        continue;
      }
      if(!evts[startDate])evts[startDate]=[];
      evts[startDate].push({time:startTime,text:title,note:notes,type:inferType(title),mapUrl,ticketUrl});
    }
    return evts;
  }

  // Tab 3: Accomodations  (Hotel_Name, City, Check_In_Date, Check_In_Time, Check_Out_Date, Check_Out_Time, Address, Confirmation, Phone, Notes)
  function parseAccommodations(rows){
    const hotels=[];
    for(const row of rows){
      const name=(row[0]||'').trim();
      if(!name)continue;
      const city=(row[1]||'').trim(),checkInDate=parseSheetDate((row[2]||'').trim());
      const checkInTime=(row[3]||'').trim(),checkOutDate=parseSheetDate((row[4]||'').trim());
      const checkOutTime=(row[5]||'').trim(),address=(row[6]||'').trim();
      const conf=(row[7]||'').trim(),phone=(row[8]||'').trim(),notes=(row[9]||'').trim();
      if(!checkInDate)continue;
      hotels.push({name,city,checkInDate,checkInTime,checkOutDate,checkOutTime,address,conf,phone,notes});
    }
    return hotels;
  }

  // Tab 1: main itinerary  (Date, Day_Title, City, Country, Summary, Details)
  function parseMainTab(rows){
    const days={};
    for(const row of rows){
      const dateStr=(row[0]||'').trim();
      if(!dateStr)continue;
      const title=(row[1]||'').trim();
      const city=(row[2]||'').trim();
      const country=(row[3]||'').trim();
      const summary=(row[4]||'').trim();
      const details=(row[5]||'').trim();
      const d=parseSheetDate(dateStr);
      if(d&&title) days[d]={title,city,country,summary,details};
    }
    return days;
  }

  // Cross-check: returns list of {date, sheetTitle, appTitle} where titles diverge
  function crossCheck(dayInfo){
    const appDates=new Set(DAYS.map(d=>d.date));
    const issues=[];
    for(const [date,info] of Object.entries(dayInfo)){
      if(!appDates.has(date)) issues.push({date,sheetTitle:info.title,appTitle:null,type:'missing'});
    }
    for(const day of DAYS){
      const info=dayInfo[day.date];
      if(!info) issues.push({date:day.date,sheetTitle:null,appTitle:day.title,type:'extra'});
      else if(info.title&&day.title&&
        !day.title.toLowerCase().includes(info.title.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim().split(' ')[0])&&
        !info.title.toLowerCase().includes(day.title.toLowerCase().split(' ')[0])
      ) issues.push({date:day.date,sheetTitle:info.title,appTitle:day.title,type:'mismatch'});
    }
    return issues;
  }

  async function fetchAllSheets(){
    const [mainData,schedData,accomData]=await Promise.all([
      fetchSheetJsonp(''),
      fetchSheetJsonp('schedule_items'),
      fetchSheetJsonp('Accomodations'),
    ]);
    return {
      dayInfo: parseMainTab(gvizToRows(mainData)),
      events:  parseScheduleItems(gvizToRows(schedData)),
      hotels:  parseAccommodations(gvizToRows(accomData)),
    };
  }

  async function fetchZone(z){
    const r=await fetch(`${OM_BASE}?latitude=${z.lat}&longitude=${z.lon}&daily=temperature_2m_max,temperature_2m_min,weathercode,precipitation_probability_max&temperature_unit=fahrenheit&start_date=${z.start}&end_date=${z.end}&timezone=auto&forecast_days=16`);
    if(!r.ok)throw new Error(); return r.json();
  }

  function wxForDate(date,wxCache){
    const zone=ZONES.find(z=>date>=z.start&&date<z.end);
    if(!zone)return null;
    const data=wxCache[zone.zone];
    if(data?.daily?.time){const idx=data.daily.time.indexOf(date);if(idx!==-1)return{hi:Math.round(data.daily.temperature_2m_max[idx]),lo:Math.round(data.daily.temperature_2m_min[idx]),code:data.daily.weathercode[idx],rain:data.daily.precipitation_probability_max?.[idx]??null,color:zone.color,isAvg:false};}
    return{hi:zone.avgHi,lo:zone.avgLo,rain:zone.avgRain,code:null,color:zone.color,isAvg:true};
  }

  function resolveDay(day, syncData){
    // Hardcoded DAYS events take priority; sheet events fill days with empty arrays.
    if(day.events && day.events.length > 0)
      return { events: day.events, splitEvents: day.splitEvents };
    const sheetEvts = syncData?.events?.[day.date] || [];
    if(sheetEvts.length){
      const toEvt = r => ({ time:r.time, text:r.text, note:r.note, type:r.type, mapUrl:r.mapUrl, ticketUrl:r.ticketUrl });
      const real  = sheetEvts.filter(r => !r.time || /^\d{1,2}:/.test(r.time));
      if(real.length) return { events: real.map(toEvt), splitEvents: day.splitEvents };
    }
    return { events: [], splitEvents: day.splitEvents };
  }

  function DayCard({day,wxCache,syncData}){
    const [open,setOpen]=useState(false);
    const wx  = wxForDate(day.date,wxCache);
    const {events,splitEvents} = resolveDay(day,syncData);

    // Sheet day info — drives title/summary display and cross-check
    const info    = syncData?.dayInfo?.[day.date];
    const summary = info?.summary || '';
    const mismatch = info?.title && day.title &&
      !day.title.toLowerCase().includes(info.title.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim().split(' ')[0]) &&
      !info.title.toLowerCase().includes(day.title.toLowerCase().split(' ')[0]);

    // Augment tip with hotel check-in / checkout info from Accommodations tab
    let tip = day.tip;
    if(syncData?.hotels){
      const ci = syncData.hotels.find(h => h.checkInDate === day.date);
      if(ci && (!tip || !tip.includes(ci.name))){
        const detail = [ci.address, ci.conf&&`Conf: ${ci.conf}`, ci.phone&&`☎ ${ci.phone}`, ci.notes].filter(Boolean).join(' · ');
        tip = (tip?tip+' ':'') + `Check in — ${ci.name}${ci.checkInTime?' at '+ci.checkInTime:''}${detail?'. '+detail:''}.`;
      }
      const co = syncData.hotels.find(h => h.checkOutDate === day.date && h.checkInDate !== day.date);
      if(co && (!tip || !tip.includes(co.name))){
        tip = (tip?tip+' ':'') + `Checkout — ${co.name}${co.checkOutTime?' by '+co.checkOutTime:''}.`;
      }
    }

    const isPast  = TRIP_LIVE && day.date < TODAY;
    const isToday = TRIP_LIVE && day.date === TODAY;
    return(
      <div className="day-card" id={`day-${day.date}`} style={isPast?{opacity:0.45,filter:'grayscale(25%)'}:isToday?{boxShadow:'0 0 0 2px var(--sand)'}:undefined}>

  function PackSection({sec,checked,onToggle,filter}){
    const [open,setOpen]=useState(false);
    const items=sec.items.filter(it=>{
      if(filter==='all') return true;
      if(filter==='required') return it.required;
      return it.tags?.includes(filter);
    });
    if(!items.length)return null;
    const doneCount=items.filter(it=>checked[`${sec.cat}::${it.name}`]).length;
    return(
      <div className="pack-section">
        <div className="pack-header" onClick={()=>setOpen(o=>!o)}>
          <div className="pack-header-left">{sec.cat}</div>
          <div className="pack-header-right">
            <span className="pack-count">{doneCount}/{items.length}</span>
            <span className={`pack-chevron${open?' open':''}`}>▼</span>
          </div>
        </div>
        {open&&(
          <div className="pack-items">
            {items.map((it,i)=>{
              const key=`${sec.cat}::${it.name}`;
              const done=!!checked[key];
              return(
                <div className={`pack-item${done?' done':''}`} key={i} onClick={()=>onToggle(key)}>
                  <div className={`checkbox${done?' checked':''}`}/>
                  <div className="item-text">
                    {it.name}
                    <div className="item-tags">
                      {it.required&&<span className="tag tag-required">Required</span>}
                      {it.tags?.includes('beach')&&<span className="tag tag-beach">Beach</span>}
                      {it.tags?.includes('atv')&&<span className="tag tag-atv">ATV</span>}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  }

  function App(){
    const [tab,setTab]         = useState('itinerary');
    const [checked,setChecked] = useState(()=>{ try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{};}catch{return{};} });
    const [filter,setFilter]   = useState('all');
    const [wxCache,setWxCache] = useState({});
    const [wxLoad,setWxLoad]   = useState(false);
    const [wxTs,setWxTs]       = useState(null);
    const [sheetEvents,setSheetEvents] = useState(null);
    const [syncData,setSyncData]   = useState(()=>{ try{const c=JSON.parse(localStorage.getItem(SYNC_KEY)||'null');return c?.data||null;}catch{return null;} });
    const [syncTs,setSyncTs]       = useState(()=>{ try{const c=JSON.parse(localStorage.getItem(SYNC_KEY)||'null');return c?.ts||null;}catch{return null;} });
    const [syncLoad,setSyncLoad]   = useState(false);
    const [syncErr,setSyncErr]     = useState(null);
    const [crossIssues,setCrossIssues] = useState([]);

    useEffect(()=>{ localStorage.setItem(STORAGE_KEY,JSON.stringify(checked)); },[checked]);

    const loadWeather=useCallback(async(force=false)=>{
      try{
        const cached=JSON.parse(localStorage.getItem(WEATHER_KEY)||'null');
        if(!force&&cached&&Date.now()-cached.ts<WEATHER_TTL){setWxCache(cached.data);setWxTs(cached.ts);return;}
        setWxLoad(true);
        const results=await Promise.allSettled(ZONES.map(fetchZone));
        const data={};
        results.forEach((r,i)=>{if(r.status==='fulfilled')data[ZONES[i].zone]=r.value;});
        setWxCache(data);setWxTs(Date.now());
        localStorage.setItem(WEATHER_KEY,JSON.stringify({ts:Date.now(),data}));
      }catch(e){console.warn('weather fetch failed',e);}finally{setWxLoad(false);}
    },[]);

    const loadSheet=useCallback(async()=>{
      if(!SHEET_ID)return;
      try{
        const cached=JSON.parse(localStorage.getItem(SHEET_KEY)||'null');
        if(cached&&Date.now()-cached.ts<SHEET_TTL){setSheetEvents(cached.data);return;}
        const data=await fetchSheet();
        if(data){setSheetEvents(data);localStorage.setItem(SHEET_KEY,JSON.stringify({ts:Date.now(),data}));}
      }catch(e){console.warn('sheet fetch failed',e);}
    },[]);

    const loadSync=useCallback(async(force=false)=>{
      try{
        const cached=JSON.parse(localStorage.getItem(SYNC_KEY)||'null');
        if(!force&&cached&&Date.now()-cached.ts<SYNC_TTL){setSyncData(cached.data);setSyncTs(cached.ts);return;}
        setSyncLoad(true);setSyncErr(null);
        const data=await fetchAllSheets();
        setSyncData(data);setSyncTs(Date.now());
        localStorage.setItem(SYNC_KEY,JSON.stringify({ts:Date.now(),data}));
        setCrossIssues(crossCheck(data.dayInfo));
      }catch(e){
        setSyncErr(e.message||'Sync failed — check that the Sheet is set to "Anyone with the link can view"');
        console.warn('sync failed',e);
      }finally{setSyncLoad(false);}
    },[]);

    useEffect(()=>{loadWeather();loadSheet();loadSync();},[]);

    useEffect(()=>{
      if(tab!=='itinerary')return;
      requestAnimationFrame(()=>{
        const target=DAYS.find(d=>d.date===TODAY)?.date
          ||DAYS.find(d=>d.date>TODAY)?.date
          ||DAYS[0]?.date;
        const el=document.getElementById(`day-${target}`);
        if(!el)return;
        const hdr=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--hdr'))||148;
        window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-hdr-8,behavior:'smooth'});
      });
    },[tab]);

    const toggleItem=key=>setChecked(p=>({...p,[key]:!p[key]}));
    const doneTotal=ALL_KEYS.filter(k=>checked[k]).length;
    const allTags=[...new Set(SECTIONS.flatMap(s=>s.items.flatMap(i=>i.tags||[])))];

    return(
      <div>
        <header className="app-header">
          <div className="header-title">Clarkes in Sicily</div>
          <div className="header-dates">Jun 5 – Jul 2, 2026</div>
          <div className="header-route">Lisbon · Sicily · Madrid · Barcelona</div>
          <div className="tab-bar">
            <button className={`tab-btn${tab==='itinerary'?' active':''}`} onClick={()=>setTab('itinerary')}>Itinerary</button>
            <button className={`tab-btn${tab==='weather'?' active':''}`}   onClick={()=>setTab('weather')}>Weather</button>
            <button className={`tab-btn${tab==='packing'?' active':''}`}   onClick={()=>setTab('packing')}>Packing</button>
          </div>
        </header>

        {tab==='itinerary'&&(
          <div className="tab-content">
            <div className="sync-bar">
              <div className="sl" style={{margin:0,flex:1}}>{DAYS.length} Days · tap ▼ to expand</div>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                {syncTs&&<span className="sync-ts">{syncLoad?'':timeAgo(syncTs)}</span>}
                <button className="sync-btn" onClick={()=>loadSync(true)} disabled={syncLoad}>
                  {syncLoad?'Syncing…':'⟳ Sync'}
                </button>
              </div>
            </div>
            {syncErr&&<div className="sync-err">⚠️ {syncErr}</div>}
            {DAYS.map(d=>(
              <DayCard key={d.date+d.day} day={d} wxCache={wxCache} syncData={syncData}/>
            ))}
            <div className="app-footer">🇵🇹 🇮🇹 🇪🇸 Bon Voyage, Clarkes!</div>
          </div>
        )}

        {tab==='weather'&&(
          <div className="tab-content">
            <div className="sl">Forecast by region</div>
            <div className="weather-grid">
              {ZONES.map(z=>(
                <WeatherCard key={z.zone} zone={z} data={wxCache[z.zone]} loading={wxLoad}/>
              ))}
            </div>
            <div className="wx-footer">
              <div className="wx-updated">{wxTs?`Updated ${timeAgo(wxTs)}`:''}</div>
              <button className="refresh-btn" onClick={()=>loadWeather(true)} disabled={wxLoad}>
                {wxLoad?'Refreshing…':'Refresh'}
              </button>
            </div>
            <div className="app-footer">Forecasts via open-meteo.com · Free &amp; no API key required</div>
          </div>
        )}

        {tab==='packing'&&(
          <div className="tab-content">
            <div className="progress-bar-wrap">
              <div className="progress-top">
                <span className="progress-title">Packing progress</span>
                <span className="progress-frac">{doneTotal} / {ALL_KEYS.length}</span>
              </div>
              <div className="progress-track"><div className="progress-fill" style={{width:`${ALL_KEYS.length?doneTotal/ALL_KEYS.length*100:0}%`}}/></div>
            </div>
            <div className="sl">Filter</div>
            <div className="filters">
              {['all','required',...allTags].map(f=>(
                <button key={f} className={`filter-btn${filter===f?' active':''}`} onClick={()=>setFilter(f)}>
                  {f==='all'?'All items':f==='atv'?'ATV':f.charAt(0).toUpperCase()+f.slice(1)}
                </button>
              ))}
            </div>
            <div className="sl">Items</div>
            {SECTIONS.map(s=>(
              <PackSection key={s.cat} sec={s} checked={checked} onToggle={toggleItem} filter={filter}/>
            ))}
            <div className="app-footer">Saved locally on this device</div>
          </div>
        )}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
